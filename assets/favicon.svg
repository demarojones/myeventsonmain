  <!-- Right arm -->
  <path d="M37 25 Q46 27 48 33" stroke="#FAFAF8" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Candle cups -->
  <rect x="13" y="33" width="6" height="3" rx="1" fill="#FAFAF8"/>
  <rect x="20.5" y="35" width="5" height="3" rx="1" fill="#FAFAF8"/>
